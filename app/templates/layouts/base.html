<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3525cd">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Navegación principal">
      <a class="rail__brand" href="/dashboard">
        <span class="rail__mark" aria-hidden="true">IC</span>
        <span class="rail__brand-text">
          <strong>{{ app_name }}</strong>
          <small>Robótica e Inglés</small>
        </span>
      </a>
      <nav class="rail__nav">
        <a
          class="rail__link{% if request.url.path == '/dashboard' %} rail__link--active{% endif %}"
          href="/dashboard"
          {% if request.url.path == '/dashboard' %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">▤</span>
          <span>Dashboard</span>
        </a>
        <a
          class="rail__link{% if request.url.path.startswith('/alumnos') %} rail__link--active{% endif %}"
          href="/alumnos"
          {% if request.url.path.startswith('/alumnos') %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">◎</span>
          <span>Alumnos</span>
        </a>
        <a
          class="rail__link{% if request.url.path.startswith('/pos') %} rail__link--active{% endif %}"
          href="/pos"
          {% if request.url.path.startswith('/pos') %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">▣</span>
          <span>Cobro Express</span>
        </a>
        <a
          class="rail__link{% if request.url.path.startswith('/deudas') %} rail__link--active{% endif %}"
          href="/deudas"
          {% if request.url.path.startswith('/deudas') %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">▥</span>
          <span>Deudas</span>
        </a>
        <a
          class="rail__link{% if request.url.path.startswith('/reposiciones') %} rail__link--active{% endif %}"
          href="/reposiciones"
          {% if request.url.path.startswith('/reposiciones') %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">↺</span>
          <span>Reposiciones</span>
        </a>
        <a
          class="rail__link{% if request.url.path.startswith('/asistencias') %} rail__link--active{% endif %}"
          href="/asistencias"
          {% if request.url.path.startswith('/asistencias') %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">▤</span>
          <span>Asistencias</span>
        </a>
        <a
          class="rail__link{% if request.url.path.startswith('/grupos') %} rail__link--active{% endif %}"
          href="/grupos"
          {% if request.url.path.startswith('/grupos') %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">▦</span>
          <span>Grupos</span>
        </a>
        <a
          class="rail__link{% if request.url.path.startswith('/maestros') %} rail__link--active{% endif %}"
          href="/maestros"
          {% if request.url.path.startswith('/maestros') %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">◫</span>
          <span>Maestros</span>
        </a>
        <a
          class="rail__link{% if request.url.path.startswith('/pagos-maestros') %} rail__link--active{% endif %}"
          href="/pagos-maestros"
          {% if request.url.path.startswith('/pagos-maestros') %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">▩</span>
          <span>Pago a maestros</span>
        </a>
        <a
          class="rail__link{% if request.url.path.startswith('/sucursales') %} rail__link--active{% endif %}"
          href="/sucursales"
          {% if request.url.path.startswith('/sucursales') %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">⌂</span>
          <span>Sucursales</span>
        </a>
        <a
          class="rail__link{% if request.url.path.startswith('/configuracion') %} rail__link--active{% endif %}"
          href="/configuracion"
          {% if request.url.path.startswith('/configuracion') %}aria-current="page"{% endif %}
        >
          <span class="rail__icon" aria-hidden="true">⚙</span>
          <span>Configuración</span>
        </a>
      </nav>
      <form class="rail__logout-form" method="post" action="/logout">
        <button class="rail__logout" type="submit">Cerrar sesión</button>
      </form>
      <p class="rail__foot">Sistema local · 127.0.0.1</p>
    </aside>
    <main class="workspace">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
