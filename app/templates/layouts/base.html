<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3525cd">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Navegación principal">
      <a class="rail__brand" href="/">
        <span class="rail__mark" aria-hidden="true">IC</span>
        <span class="rail__brand-text">
          <strong>{{ app_name }}</strong>
          <small>Robótica e Inglés</small>
        </span>
      </a>
      <nav class="rail__nav">
        <a class="rail__link rail__link--active" href="/pos" aria-current="page">
          <span class="rail__icon" aria-hidden="true">▣</span>
          <span>Cobro Express</span>
        </a>
      </nav>
      <p class="rail__foot">Sistema local · 127.0.0.1</p>
    </aside>
    <main class="workspace">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
